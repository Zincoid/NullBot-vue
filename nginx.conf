# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    # include             /usr/local/nginx/conf/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {

        listen       80;
        listen       [::]:80;
        server_name  nullbot.zincoid.online;
        root         /usr/share/nginx/dist;
        # root         /root/Nginx/dist;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        # SPA fallback: 将所有非文件请求回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # WEB API 代理 - 网页接口代理
        location /api {
            # 方案1: 直接转发，后端接收 /api/xxx 请求
            # proxy_pass http://localhost:8080/nullbot/;

            # 方案2: 重写路径，将 /api 替换为 /nullbot
            rewrite ^/api/(.*) /nullbot/$1 break;
            proxy_pass http://localhost:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 512M;
            client_body_buffer_size 128k;
            client_body_timeout 600s;
        }

        # WebSocket 代理 -  监控端点代理
        location /ws {
            proxy_pass http://localhost:8080;  # 转发到后端 WebSocket 服务
            proxy_http_version 1.1;  # 必须使用 HTTP/1.1
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 可选: 增加超时时间 防止长时间无消息断开
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }

